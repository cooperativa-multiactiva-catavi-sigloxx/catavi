<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Historia · Cooperativa Siglo XX Catavi</title>
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="historia.css">
</head>
<body>
    <div id="loading">Cargando el cerro…</div>

    <div id="canvas-container"></div>

    <!-- Puntos numerados de las épocas (los llena historia.js) -->
    <div id="ruta"></div>

    <a class="volver" href="CATAVI.html">← Volver</a>

    <!-- Ayuda -->
    <button id="help-button" type="button" aria-label="Ayuda">?</button>
    <div class="controls">
        <h4>Controles</h4>
        <p><b>W / S</b> caminar</p>
        <p><b>A / D</b> girar</p>
        <p><b>F</b> ver información</p>
        <p><b>Espacio</b> siguiente época</p>
        <p><b>1 – 8</b> ir a una época</p>
        <p><b>Esc</b> cerrar tarjeta</p>
    </div>

    <!-- Mensaje de bienvenida -->
    <div id="hint">Sube por el camino del cerro: cada parada es una época de nuestra historia</div>

    <!-- three.js (versión r128). Si ya tienes estos archivos en tu carpeta, cambia las rutas. -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/libs/fflate.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/FBXLoader.js"></script>

    <script src="historia.js"></script>
</body>
</html>
